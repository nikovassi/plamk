<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Няма връзка</title>
<style>
  :root { --bg:#f4f2ee; --ink:#141517; --ink2:#4b4d52; --accent:#b4501e; --ai:#fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --ink:#f1efea; --ink2:#b7b4ae; --accent:#f08a52; --ai:#141517; } }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width: 26rem; }
  h1 { font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--ink2); margin: 0 0 12px; }
  a { display:inline-flex; align-items:center; height:52px; padding:0 24px; border-radius:999px; background:var(--accent); color:var(--ai); font-weight:600; text-decoration:none; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Няма интернет връзка</h1>
  <p>Тази страница не е запазена за офлайн режим.</p>
  <p>Ако попълвахте запитване — черновата е запазена на устройството и ще продължите от същото място.</p>
  <a href="./">Опитай отново</a>
</main>
</body>
</html>
