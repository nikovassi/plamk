<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ee" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <!--app-head-->
    <script>
      // Apply theme + enable motion classes before first paint (no flash, no hidden content without JS)
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t)
          var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111214' : '#f4f2ee')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript><p style="padding:1rem">За формата за запитване е необходим JavaScript. Можете да се свържете с нас по телефон или email.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
